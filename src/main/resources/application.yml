# yml used only to fetch necessary configuration not overridden by application.properties
currency:
  service:
    base-url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api"
    endpoints:
      all-currencies: "currencies"
      currency: "eur"
    api-version: "v1"
springdoc:
  api-docs:
    path: "/api/docs"
  swagger-ui:
    path: "/api/swagger-ui"